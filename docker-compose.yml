# 로컬 개발용 MySQL. 실행: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: hackathon4-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hackathon4
      MYSQL_USER: hackathon4
      MYSQL_PASSWORD: hackathon4
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql

  # 로컬 Redis. 호스트 6379 는 다른 Redis 와 겹칠 수 있어 6380 으로 뺀다 (MySQL 3307 과 같은 이유)
  redis:
    image: redis:7.4
    container_name: hackathon4-redis
    ports:
      - "6380:6379"

volumes:
  mysql-data:
