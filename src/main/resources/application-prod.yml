# 운영(EC2 + RDS): 값은 전부 환경변수로 주입한다. 여기에 실제 값을 적지 않는다
server:
  # Caddy(리버스 프록시) 뒤에서 원래 scheme/host 를 인식하도록 X-Forwarded-* 헤더를 반영한다
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
