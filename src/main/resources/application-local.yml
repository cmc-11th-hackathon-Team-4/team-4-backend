# 로컬 개발용: backend/docker-compose.yml 의 MySQL 에 붙는다
# 프로젝트 루트의 .env(gitignore)가 있으면 그 값을, 없으면 기본값을 쓴다
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:hackathon4}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:hackathon4}
    password: ${DB_PASSWORD:hackathon4}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
