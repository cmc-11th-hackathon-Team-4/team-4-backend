spring:
  application:
    name: backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    # 프론트 주소만 허용 (쉼표로 구분, 공백 없이): Vercel 운영 / Vercel 프리뷰 / 로컬 Vite 개발 서버
    allowed-origin-patterns: "https://team-4-frontend-bice.vercel.app,https://team-4-frontend-*.vercel.app,http://localhost:5173"
