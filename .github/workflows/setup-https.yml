# 서버에서 scripts/ec2-setup.sh <도메인> 을 다시 실행해 Caddy 를 HTTPS(Let's Encrypt)로 전환한다.
# 서버에 직접 접속할 수 없는 팀원도 Actions 에서 수동 실행(Run workflow)만으로 할 수 있다.
# 여러 번 실행해도 안전하다. 앱 서비스, app.jar, .env 는 건드리지 않는다.
name: Setup HTTPS (Caddy domain)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "HTTPS 를 적용할 도메인 (A 레코드가 서버 IP 를 가리켜야 한다)"
        required: true
        type: string
        default: niturnnaeturn.duckdns.org

# 배포와 겹치지 않게 deploy.yml 과 같은 그룹을 쓴다
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  setup-https:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DOMAIN: ${{ inputs.domain }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate domain
        run: |
          # 입력값은 반드시 env 의 $DOMAIN 으로만 쓴다 (셸 인젝션 방지)
          DOMAIN_REGEX='^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          if [[ ! "$DOMAIN" =~ $DOMAIN_REGEX ]]; then
            echo "도메인 형식이 올바르지 않다 (소문자 영문/숫자/하이픈, 예: api.example.com)" >&2
            exit 1
          fi
          echo "domain: $DOMAIN"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check DNS A record
        run: |
          IPS=$(dig +short A "$DOMAIN")
          if [ -z "$IPS" ]; then
            echo "DNS A 레코드가 없다. 도메인의 A 레코드를 서버 탄력적 IP 로 지정한 뒤 다시 실행한다" >&2
            exit 1
          fi
          echo "A 레코드: $IPS"

      - name: Upload setup script to S3
        run: |
          # 비공개 저장소라 서버가 스크립트를 직접 못 받으므로 S3 로 전달한다 (EC2 역할은 deploy/* 읽기 권한이 있다)
          aws s3 cp scripts/ec2-setup.sh "s3://$S3_BUCKET/deploy/ec2-setup.sh" --only-show-errors

      - name: Run ec2-setup.sh on instance via SSM
        run: |
          # $PATH 는 러너가 아니라 서버에서 확장되도록 작은따옴표 안에 둔다
          REMOTE_CMD='export PATH=/usr/local/bin:$PATH AWS_DEFAULT_REGION='"$AWS_REGION"'; set -e; aws s3 cp s3://'"$S3_BUCKET"'/deploy/ec2-setup.sh /tmp/ec2-setup.sh --only-show-errors; bash /tmp/ec2-setup.sh '"$DOMAIN"
          PARAMS=$(jq -cn --arg c "$REMOTE_CMD" '{commands:[$c]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "setup https" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "ssm command id: $CMD_ID"

          # 패키지 설치가 있을 수 있어서 최대 10분까지 직접 폴링한다 (5초 x 120회)
          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "----- status: $STATUS -----"
          [ "$STATUS" = "Success" ]

      - name: Verify HTTPS
        run: |
          # 인증서 발급에 시간이 걸릴 수 있어서 5초 간격으로 최대 약 3분 재시도한다
          for i in $(seq 1 36); do
            if curl -fsS "https://$DOMAIN/api/v1/health"; then
              echo
              echo "https ok (${i} tries)"
              exit 0
            fi
            sleep 5
          done
          echo "인증서 발급 실패 가능성. 서버에서 journalctl -u caddy 를 확인하고, 보안 그룹에 80/443 이 열려 있는지 확인한다" >&2
          exit 1
