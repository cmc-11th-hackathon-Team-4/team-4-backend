name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나만 실행한다
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build boot jar
        # 해커톤 속도 우선: 테스트는 건너뛴다 (-x test)
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Upload jar and env file
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          # build.gradle 에서 plain jar 를 끄고 이름을 backend.jar 로 고정해 두었다
          scp build/libs/backend.jar ec2:app/app.jar.new
          # APP_ENV 시크릿이 있으면 서버의 ~/app/.env 를 덮어쓴다 (로그에는 출력하지 않는다)
          if [ -n "$APP_ENV" ]; then
            printf '%s\n' "$APP_ENV" | tr -d '\r' | ssh ec2 'umask 077 && cat > ~/app/.env'
          fi

      - name: Restart service and health check
        run: |
          ssh ec2 'bash -s' <<'EOF'
          set -e
          mv ~/app/app.jar.new ~/app/app.jar
          sudo systemctl restart team4-backend
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health > /dev/null; then
              echo "deploy ok (${i} tries)"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed"
          systemctl is-active team4-backend || true
          sudo journalctl -u team4-backend -n 80 --no-pager
          exit 1
          EOF
